[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-migration-workbench"
version = "1.0.0"
description = "Transactional SQLite migrations, checksum drift detection and dry runs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
schema-migration-workbench = "schema_migration_workbench:entrypoint"

[tool.setuptools.packages.find]
include = ["schema_migration_workbench*"]
